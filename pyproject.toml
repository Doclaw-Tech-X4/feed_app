[project]
name = "feed-app"
version = "0.1.0"
description = "This is the first version of it i used for learning advanced fastapi"
readme = "README.md"
authors = [
    { name = "Doclaw-Tech-X4", email = "doclaw0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.161.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=4,<5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
feed-app = "main:main"

[tool.uv]
package = false

[tool.uv.build-backend]
module-root = ""
module-names = ["app", "main"]
